<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News Portal{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'news:index' %}">Home</a>
        </nav>
    </header>
    <main>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <aside class="sidebar">
            {% block sidebar %}{% endblock %}
        </aside>
    </main>
    <footer>
        <p>&copy; 2026 News Portal</p>
    </footer>
</body>
</html>
