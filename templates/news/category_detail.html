{% extends 'base.html' %}

{% block title %}{{ category.name }} - News Portal{% endblock %}

{% block content %}
    <h1 class="page-title">Categoría: {{ category.name }}</h1>
    {% for article in articles %}
        {% include 'news/_article_card.html' %}
    {% empty %}
        <div class="empty-state">
            <i class="fas fa-folder-open"></i>
            <p>No hay noticias en esta categoría.</p>
        </div>
    {% endfor %}
{% endblock %}
