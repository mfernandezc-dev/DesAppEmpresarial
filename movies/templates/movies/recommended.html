<!DOCTYPE html>
<html>
<head>
    <title>Recommended Movies</title>
</head>
<body>
    <h1>Recommended Movies</h1>
    <ul>
    {% for movie in movies %}
        <li>{{ movie.title }} - Average score: {{ movie.avg_score|floatformat:1 }}</li>
    {% empty %}
        <li>No movies found.</li>
    {% endfor %}
    </ul>
</body>
</html>
